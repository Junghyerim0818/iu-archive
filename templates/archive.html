{% extends "base.html" %}
{% block content %}
<section>
  <h1>아카이브</h1>
  <p>날짜별, 행사별로 정리된 아이유 사진 모음</p>
</section>

{% if grouped %}
  {% for key, photos in grouped.items() %}
    <section>
      <h2>{{ key }}</h2>
      <div class="grid">
        {% for photo in photos %}
          <figure class="card">
            <img src="{{ file_url(photo) }}" alt="{{ photo.event_name }}" loading="lazy">
            <figcaption>{{ photo.taken_date }} · {{ photo.event_name or '기타' }}</figcaption>
          </figure>
        {% endfor %}
      </div>
    </section>
  {% endfor %}
{% else %}
  <div class="empty-state">
    <p>아직 승인된 사진이 없습니다.</p>
  </div>
{% endif %}
{% endblock %}
