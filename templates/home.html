{% extends "base.html" %}
{% block content %}
  <!-- 파도 컨테이너 -->
  <div class="wave-container" id="waveContainer">
    <svg class="wave-svg" version="1.1" xmlns="http://www.w3.org/2000/svg"
		xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="100%" height="100%" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
		<defs>
			<linearGradient id="bg">
				<stop offset="0%" style="stop-color:rgba(191, 194, 201, 0.06)"></stop>
				<stop offset="50%" style="stop-color:rgba(202, 204, 207, 0.4)"></stop>
				<stop offset="100%" style="stop-color:rgba(159, 159, 160, 0.2)"></stop>
			</linearGradient>
			<path id="wave" fill="url(#bg)" d="M-363.852,502.589c0,0,236.988-41.997,505.475,0
	s371.981,38.998,575.971,0s293.985-39.278,505.474,5.859s493.475,48.368,716.963-4.995v560.106H-363.852V502.589z" />
		</defs>
		<g>
			<use xlink:href='#wave' opacity=".3">
				<animateTransform
          attributeName="transform"
          attributeType="XML"
          type="translate"
          dur="10s"
          calcMode="spline"
          values="270 230; -334 180; 270 230"
          keyTimes="0; .5; 1"
          keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
          repeatCount="indefinite" />
			</use>
			<use xlink:href='#wave' opacity=".6">
				<animateTransform
          attributeName="transform"
          attributeType="XML"
          type="translate"
          dur="8s"
          calcMode="spline"
          values="-270 230;243 220;-270 230"
          keyTimes="0; .6; 1"
          keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
          repeatCount="indefinite" />
			</use>
			<use xlink:href='#wave' opacty=".9">
				<animateTransform
          attributeName="transform"
          attributeType="XML"
          type="translate"
          dur="6s"
          calcMode="spline"
          values="0 230;-140 200;0 230"
          keyTimes="0; .4; 1"
          keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
          repeatCount="indefinite" />
			</use>
		</g>
	</svg>
  </div>

  <!-- 클릭 시 나타나는 모자이크 섹션 -->
  <div class="mosaic-section" id="mosaicSection">
    <!-- 버튼 컨테이너 (상단에 위치) -->
    <div class="cta-container-top">
      <a href="{% if user %}{{ url_for('upload') }}{% else %}{{ url_for('login') }}{% endif %}" class="cta-button">
        <span>아카이브 추가하기</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </a>
      <a href="{{ url_for('archive') }}" class="cta-button">
        <span>아카이브 보러가기</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
    
    <div class="mosaic-container" id="mosaicContainer">
      {% if random_photos %}
        {% for photo in random_photos %}
          <div class="mosaic-item" style="--delay: {{ loop.index0 * 0.05 }}s">
            <img src="{{ file_url(photo) }}" alt="{{ photo.original_name }}" loading="lazy" onclick="openImageModal('{{ file_url(photo) }}', '{{ photo.original_name }}')">
          </div>
        {% endfor %}
      {% endif %}
    </div>
  </div>

<script>
  let isActivated = false;
  
  // 클릭/터치 이벤트 핸들러
  function handleActivation(event) {
    // 이미 활성화되었으면 리턴
    if (isActivated) return;
    
    // 링크나 버튼 클릭은 무시
    if (event.target.closest('a') || event.target.closest('button')) {
      return;
    }
    
    isActivated = true;
    
    const iuContainer = document.getElementById('iuContainer');
    const iuTitle = document.getElementById('iuTitle');
    const mosaicSection = document.getElementById('mosaicSection');
    
    // 타이틀 페이드 아웃
    if (iuContainer && iuTitle) {
      iuContainer.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
      iuContainer.style.opacity = '0';
      iuContainer.style.transform = 'translateY(-20px)';
      
      setTimeout(() => {
        iuContainer.style.visibility = 'hidden';
      }, 800);
    }
    
    // 모자이크 페이드 인
    if (mosaicSection) {
      setTimeout(() => {
        mosaicSection.classList.add('visible');
      }, 300);
    }
    
    // 이벤트 리스너 제거
    document.removeEventListener('click', handleActivation);
    document.removeEventListener('touchstart', handleActivation);
  }
  
  // 초기 이벤트 리스너 추가
  window.addEventListener('load', function() {
    // 약간의 지연 후 클릭 이벤트 활성화 (초기 로드 방해 방지)
    setTimeout(() => {
      document.addEventListener('click', handleActivation, { once: true });
      document.addEventListener('touchstart', handleActivation, { once: true });
    }, 500);
  });
</script>
{% endblock %}
