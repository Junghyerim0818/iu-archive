{% extends "base.html" %}
{% block content %}
<section>
  <h1>아이유 사진 아카이브</h1>
  <p>팬들이 함께 꾸리는 사진 저장소. 구글 로그인을 통해 업로드하고, 관리 승인 후 공개됩니다.</p>
</section>

<section>
  <h2>최근 승인된 사진</h2>
  {% if photos %}
    <div class="grid">
      {% for photo in photos %}
        <figure class="card">
          <img src="{{ file_url(photo) }}" alt="{{ photo.event_name }}">
          <figcaption>{{ photo.taken_date }} · {{ photo.event_name }}</figcaption>
        </figure>
      {% endfor %}
    </div>
  {% else %}
    <p>아직 승인된 사진이 없습니다.</p>
  {% endif %}
</section>
{% endblock %}
