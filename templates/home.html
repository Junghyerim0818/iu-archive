{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>IU Archive</h1>
  <p>팬들이 함께 꾸리는 아이유 사진 아카이브<br>구글 로그인을 통해 업로드하고, 관리 승인 후 공개됩니다.</p>
  {% if not user %}
    <a href="{{ url_for('login') }}" style="display: inline-block; text-decoration: none;">
      <button>구글 로그인으로 시작하기</button>
    </a>
  {% endif %}
</section>

<section>
  <h2>최근 승인된 사진</h2>
  {% if photos %}
    <div class="grid">
      {% for photo in photos %}
        <figure class="card">
          <img src="{{ file_url(photo) }}" alt="{{ photo.event_name }}" loading="lazy">
          <figcaption>{{ photo.taken_date }} · {{ photo.event_name or '기타' }}</figcaption>
        </figure>
      {% endfor %}
    </div>
  {% else %}
    <div class="empty-state">
      <p>아직 승인된 사진이 없습니다.<br>첫 번째 사진을 업로드해보세요!</p>
    </div>
  {% endif %}
</section>
{% endblock %}
